<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Soldered datasheet generator</title>
<style>
  :root { --solder-purple: #5b2379; --solder-blue: #23b9d6; }
  * { box-sizing: border-box; }
  body {
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    max-width: 640px;
    margin: 3em auto;
    padding: 0 1.5em;
    color: #1a1a1a;
  }
  .brand-bar {
    height: 6px;
    background: linear-gradient(to right, var(--solder-purple) 80%, var(--solder-blue) 80%);
    margin-bottom: 1.5em;
  }
  h1 { color: var(--solder-purple); font-size: 1.4em; }
  label { display: block; margin: 1.2em 0 0.3em; font-weight: 600; }
  select, input[type=text] {
    width: 100%; padding: 0.5em; font-size: 1em;
    border: 1px solid #ccc; border-radius: 4px;
  }
  .radio-row { display: flex; gap: 1.5em; margin-top: 0.3em; }
  .radio-row label { font-weight: normal; margin: 0; display: flex; gap: 0.4em; align-items: center; }
  button {
    margin-top: 1.6em; padding: 0.7em 1.4em; font-size: 1em;
    background: var(--solder-purple); color: white; border: none;
    border-radius: 4px; cursor: pointer;
  }
  button:hover { background: #47215f; }
  .error { color: #b3261e; margin-top: 1em; }
  .hint { color: #666; font-size: 0.9em; margin-top: 0.3em; }
</style>
</head>
<body>
  <div class="brand-bar"></div>
  <h1>Soldered datasheet generator</h1>
  <p>Pick a product, choose a datasheet type, and download a print-ready PDF.</p>

  {% if error %}<p class="error">{{ error }}</p>{% endif %}

  <form action="/pdf" method="get">
    <label for="sku-select">Product</label>
    <select id="sku-select" onchange="document.getElementById('sku-text').value = this.value">
      <option value="">— choose a product —</option>
      {% for sku, name in seed_products %}
      <option value="{{ sku }}">{{ name }} ({{ sku }})</option>
      {% endfor %}
    </select>

    <label for="sku-text">Or enter a SKU directly</label>
    <input id="sku-text" name="sku" type="text" placeholder="e.g. 333232" required>
    <div class="hint">Find the SKU in a solde.red product URL, e.g. solde.red/333232.</div>

    <label>Datasheet type</label>
    <div class="radio-row">
      <label><input type="radio" name="template" value="onepager" checked> One-pager</label>
      <label><input type="radio" name="template" value="full"> Full datasheet</label>
    </div>

    <button type="submit">Generate PDF</button>
  </form>
</body>
</html>
